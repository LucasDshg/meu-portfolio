name: Vercel Production Deployment

permissions:
  contents: write
  packages: write
  pages: write 
  id-token: write

on:
  pull_request:
    branches:
      - main
      - master
    types:
      - closed
env:
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}



jobs:
  validate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Lint
        run: npm run lint
      - name: Run Tests & Check Coverage (Min 75%)
        run: |
          npm run test:coverage
          echo "### 🧪 Quality Gate Passed" >> $GITHUB_STEP_SUMMARY
          echo "O projeto atingiu os requisitos mínimos de qualidade:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linting OK" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cobertura de testes > 75% (conforme definido em vitest.config.ts)" >> $GITHUB_STEP_SUMMARY

  versioning:
    name: Versioning (Bump)
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version_bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Bump package version
        id: version_bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Bump na raiz: altera package.json, cria commit e tag
          NEW_VERSION=$(npm version patch -m "Chore: Bump version to %s")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          
          # Envia o commit de bump e a nova tag para o repositório
          git push origin main --tags

  build:
    name: Build Project
    needs: versioning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist

  deploy:
    name: Deploy to Vercel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: ./dist
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-version: latest
          vercel-args: '--prod'
          working-directory: ./dist

  release:
    name: Create GitHub Release
    needs: [versioning, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.versioning.outputs.new_version }}
        run: |
          gh release create $VERSION \
            --title "Release $VERSION" \
            --notes "Automated release from merged PR"